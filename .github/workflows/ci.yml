name: Application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and worker test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-worker.txt
      - name: Use the production sandbox reference
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          workflow = Path('.github/workflows/worker.yml').read_text()
          image = re.search(r'SANDBOX_IMAGE:\s*(ghcr\.io/[^\s]+@sha256:[a-f0-9]{64})', workflow).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SANDBOX_IMAGE=' + image + '\n')
          PY
      - name: Pull sandbox
        run: docker pull "$SANDBOX_IMAGE"
      - name: Test backend and sandbox integration
        run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
