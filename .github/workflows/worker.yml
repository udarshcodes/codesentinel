name: CodeSentinel Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID for the job'
        required: true
      repo_url:
        description: 'Repository URL to analyze'
        required: true
      backend_url:
        description: 'Webhook URL of the CodeSentinel backend'
        required: true
      commit_sha:
        description: 'Optional commit SHA to analyze'
        required: false
        default: ''
      worker_attempt_id:
        description: 'Worker attempt ID for lease validation'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CodeSentinel Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'
          
      - name: Install uv
        run: pip install uv
        
      - name: Install Python Dependencies
        run: |
          uv pip install --system -r backend/requirements.txt
          uv pip install --system -r backend/requirements-worker.txt
          python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.WORKER_GITHUB_TOKEN }}
          
      - name: Run CodeSentinel AI Worker
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          WORKER_WEBHOOK_SECRET: ${{ secrets.WORKER_WEBHOOK_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SANDBOX_IMAGE: ghcr.io/udarshcodes/codesentinel-sandbox@sha256:17d875c448ff1b1d6e8dff53f8ea4d80fd77a8f899a72d2f86aa596ba8839c6d
          TASK_ID: ${{ github.event.inputs.task_id }}
          REPO_URL: ${{ github.event.inputs.repo_url }}
          BACKEND_URL: ${{ github.event.inputs.backend_url }}
          COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          WORKER_ATTEMPT_ID: ${{ github.event.inputs.worker_attempt_id }}
          ENVIRONMENT: production
        run: |
          python backend/worker.py
