services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL
      - WORKER_WEBHOOK_SECRET
      - GITHUB_WEBHOOK_SECRET
      - GROQ_API_KEY_1
      - GROQ_API_KEY_2
      - GROQ_API_KEY_3
      - GROQ_API_KEY_4
      - GROQ_API_KEY_5
      - GROQ_API_KEY_6
      - GITHUB_TOKEN
      - ADMIN_SECRET
      - CORS_ORIGINS
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped