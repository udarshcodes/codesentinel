name: CodeSentinel CI/CD

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CodeSentinel Analysis
        id: codesentinel
        env:
          CODESENTINEL_API_URL: ${{ secrets.CODESENTINEL_API_URL }}
        run: |
          API_URL="$CODESENTINEL_API_URL"
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          SHA="$GITHUB_SHA"
          
          if [ -z "$API_URL" ]; then
            echo "Error: CODESENTINEL_API_URL secret is not set."
            exit 1
          fi

          echo "Triggering CodeSentinel analysis for $REPO_URL at $SHA..."
          
          # We call the /api/analyze endpoint to queue the repository.
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 60 -X POST "$API_URL/api/analyze" \
               -H "Content-Type: application/json" \
               -d "{\"repo_url\": \"$REPO_URL\", \"commit_sha\": \"$SHA\"}")
          
          # Extract task_id using jq
          TASK_ID=$(printf '%s' "$RESPONSE" | jq -er '.task_id | select(type == "string" and length > 0)')
          
          if [ "$TASK_ID" == "null" ] || [ -z "$TASK_ID" ]; then
             echo "The API did not return an analysis task ID."
             exit 1
          fi
          
          echo "Analysis triggered successfully. Task ID: $TASK_ID"
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT

      - name: Post PR Submission Receipt
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_ID: ${{ steps.codesentinel.outputs.task_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          RECEIPT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > "$RUNNER_TEMP/codesentinel-comment.md" <<EOF
          **CodeSentinel analysis requested**

          Task ID: \`$TASK_ID\`

          [Submission workflow]($RECEIPT_URL)

          This workflow confirms submission only. Analysis and any proposed repair run asynchronously; a successful submission does not mean validation passed or a fix was produced.

          Live telemetry requires an authorized CodeSentinel viewer session. Viewer and approval credentials are never published in this comment.
          EOF
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/codesentinel-comment.md" --repo "$GITHUB_REPOSITORY"
